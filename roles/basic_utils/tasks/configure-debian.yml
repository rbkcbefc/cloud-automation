---

- name: Update apt packages
  become: true
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install Debian utilities
  ansible.builtin.apt:
    state: present
    name:
      - chrony
      - curl
      - unzip
      - wget
      - python3
      - python3-pip
      - htop
      - collectd
      - net-tools

- name: Ensure chrony is running.
  ansible.builtin.service:
    name: chronyd
    state: started
    enabled: true

- name: Install aws cli
  community.general.snap:
    name: aws-cli
    classic: yes

- name: Install Debian OS & ARM64 - JRE
  ansible.builtin.apt:
    deb: https://launchpad.net/~openjdk-security/+archive/ubuntu/ppa/+build/31012638/+files/openjdk-24-jre-headless_24.0.2+12~us1-0ubuntu1~25.04.1_arm64.deb
  become: true
  when: ansible_facts['os_family']|lower == 'debian' and
        ansible_architecture == 'aarch64'

- name: Install Debian OS & ARM64 - JDK
  ansible.builtin.apt:
    deb: https://launchpad.net/~openjdk-security/+archive/ubuntu/ppa/+build/31012638/+files/openjdk-24-jdk-headless_24.0.2+12~us1-0ubuntu1~25.04.1_arm64.deb
  become: true
  when: ansible_facts['os_family']|lower == 'debian' and
        ansible_architecture == 'aarch64'

- name: Install Debian OS & AMD64 - JRE
  ansible.builtin.apt:
    deb: https://launchpad.net/~openjdk-security/+archive/ubuntu/ppa/+build/31012637/+files/openjdk-24-jre-headless_24.0.2+12~us1-0ubuntu1~25.04.1_amd64.deb
  become: true
  when: ansible_facts['os_family']|lower == 'debian' and
        ansible_architecture == 'amd64'

- name: Install Debian OS & AMD64 - JDK
  ansible.builtin.apt:
    deb: https://launchpad.net/~openjdk-security/+archive/ubuntu/ppa/+build/31012637/+files/openjdk-24-jdk-headless_24.0.2+12~us1-0ubuntu1~25.04.1_amd64.deb
  become: true
  when: ansible_facts['os_family']|lower == 'debian' and
        ansible_architecture == 'amd64'

# Reboot after python3-pip
- name: Unconditionally reboot the machine with all defaults
  ansible.builtin.reboot:

- name: Check the Uptime of the servers
  ansible.builtin.shell: "uptime"
  register: uptime
  changed_when: false

- name: Show uptime
  ansible.builtin.debug: var=uptime
